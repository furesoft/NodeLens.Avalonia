name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide the state of the other.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up the SDK the repository pins
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Projectional.slnx

      - name: Build
        run: dotnet build Projectional.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Projectional.slnx --configuration Release --no-build

  byte-stability:
    name: stored form is byte-stable
    runs-on: ubuntu-latest    steps:
      - uses: actions/checkout@v4

      - name: Set up the SDK the repository pins
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The corpus is the wire format, and a diff here means older files would either
      # change on save or stop loading. This runs the corpus alone so a failure names
      # the contract that broke instead of the whole suite.
      - name: Run the corpus
        run: dotnet test tests/Projectional.Core.Tests/Projectional.Core.Tests.csproj --filter-class "*CorpusTests"

  single-file:
    name: self-contained single file (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: Projectional.Workbench.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: Projectional.Workbench
    steps:
      - uses: actions/checkout@v4

      - name: Set up the SDK the repository pins
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The bundle is a publish shape, not a build shape: the normal build stays framework-dependent
      # and multi-file so the inner loop is fast.
      - name: Publish one file
        run: >
          dotnet publish src/Projectional.Workbench
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          --output publish

      # "Single file" has to mean one file. A stray .pdb or a native library left beside the bundle
      # would still work on the machine that built it and fail on a user's, which is the whole point
      # of this job.
      - name: Assert the bundle is one file
        shell: bash
        run: |
          count=$(find publish -maxdepth 1 -type f | wc -l)
          echo "publish/ holds $count file(s):"
          find publish -maxdepth 1 -type f -printf '  %f\n'
          test "$count" -eq 1

      # The check runs before Avalonia starts, so it needs no display and proves that the language
      # packages and the projection layer are inside the bundle rather than beside it.
      - name: Smoke-run the bundle
        shell: bash
        run: ./publish/${{ matrix.exe }} --self-check